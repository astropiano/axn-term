name: axn-term-build

# Reproducible builders for the axn-term repo.
#
# Usage:
#   docker compose -f docker-compose.build.yml build              # build desktop builder once
#   docker compose -f docker-compose.build.yml run --rm desktop-build
#   docker compose -f docker-compose.build.yml run --rm desktop-windows-build   # Windows NSIS installer
#   docker compose -f docker-compose.build.yml --profile server build gateway-image session-host-image
#   ./build/build-all.sh                                          # desktop artifacts + server images
#
# The online server (.NET apps/gateway + apps/session-host) ships as container
# images, not host binaries: the `server` profile builds the same images the
# axn-term-online scenario runs (same tags, so the scenario picks them up).

services:
  desktop-build:
    build:
      context: ./build/desktop
      dockerfile: Dockerfile
    image: axn-term-desktop-builder:latest
    volumes:
      - .:/src:ro
      # Sibling ramphastos checkout — the build runs in /build/source, so the
      # ramphastos-client alias (../../../ramphastos) resolves to /build/ramphastos.
      - ${AXN_LIBS_ROOT:-..}/ramphastos:/build/ramphastos:ro
      - desktop-cargo-cache:/cache/cargo
      - desktop-pnpm-cache:/cache/pnpm
      - desktop-vite-cache:/cache/vite
      - ./artifacts:/output
    environment:
      - CARGO_HOME=/cache/cargo
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    command: /src/build/scripts/build-desktop.sh

  # Windows desktop app, cross-compiled with cargo-xwin + NSIS.
  desktop-windows-build:
    build:
      context: ./build/windows
      dockerfile: Dockerfile
    image: axn-term-windows-builder:latest
    volumes:
      - .:/src:ro
      - ${AXN_LIBS_ROOT:-..}/ramphastos:/build/ramphastos:ro
      - desktop-windows-cargo-cache:/cache/cargo
      - desktop-pnpm-cache:/cache/pnpm
      - desktop-vite-cache:/cache/vite
      - desktop-xwin-cache:/cache/xwin
      - ./artifacts:/output
    environment:
      - CARGO_HOME=/cache/cargo
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    command: /src/build/scripts/build-desktop-windows.sh

  # WebSocket gateway — validates JWTs and spawns per-user session hosts.
  gateway-image:
    profiles: [server]
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    image: axn-term-gateway:latest

  # Per-user session host — the image the gateway spawns via the docker socket.
  session-host-image:
    profiles: [server]
    build:
      context: ./scenarios/axn-term-online/session-host
      additional_contexts:
        axn-term: .
      dockerfile: Dockerfile
    image: axn-term-host:latest

volumes:
  desktop-cargo-cache:
  desktop-pnpm-cache:
  desktop-vite-cache:
  desktop-windows-cargo-cache:
  desktop-xwin-cache:
