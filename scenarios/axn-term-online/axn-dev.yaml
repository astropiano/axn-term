description: "axn-term online — web frontend (apps/web) + .NET gateway/session host + per-user kata session hosts behind Caddy on one port"
env:
  SCENARIO_PORT: "18092"
  # bare :26 is not a published tag — pin a real one (26.0 is usually cached)
  KEYCLOAK_IMAGE: "quay.io/keycloak/keycloak:26.0"
  # LAN serving via raw IP — no DNS involved at all: everything on
  # https://<host>.local:18092 (mDNS, DHCP-proof) or the LAN IP (dev CA —
  # required because the Keycloak client enforces PKCE S256, and
  # crypto.subtle only exists in secure contexts). Clients must accept the
  # cert once (or trust certs/ca.pem).
  #
  # Machine identity is local — set AXN_LAN_IP / AXN_LAN_NAME and the
  # derived AXN_KEYCLOAK_URL / AXN_GATEWAY_URL in the gitignored .env
  # next to compose.yaml (see .env.example).
  # JWT-bound /remote: hellos must carry a keycloak token; sessions bind
  # to the publisher account (set true for anonymous local dev).
  REMOTE_AUTHORITY_ANON: "false"
  # TLS is on below — the shell's URLs must use the secure schemes or the
  # app builds http://ws:// endpoints against a TLS-only Caddy.
  AXN_SCHEME: "https"
  AXN_WS_SCHEME: "wss"
  # AXN_LIBS_ROOT (the dir holding axn-term's sibling checkouts, for
  # RAMPHASTOS_LOCAL_DEPS=1 builds) is deliberately NOT defaulted here —
  # compose falls back to ../../.., the dir containing this repo.
  # Set it in .env when doing local-deps development; see .env.example.
  # external additional_contexts (sibling checkouts) — grant bake fs access
  BUILDX_BAKE_ENTITLEMENTS_FS: "0"
  # Fixed dev cert pair in ./certs (AXN_CERT_DIR mount) — generated once,
  # never rotates across restarts, so one-time CA trust suffices. Falls
  # back to `internal` when the files are absent (set AXN_TLS=internal).
  AXN_TLS: "/certs/axn-term-dev.pem /certs/axn-term-dev-key.pem"
  # disable_redirects: cert automation on (tls internal needs it), no :80
  # http→https redirect listener
  # Remote-only shell: no cloud/hosted session path — the account's
  # mirrored desktops are the only sessions (viewer attach or nothing).
  AXN_REMOTE_ONLY: "1"
  # Server-side twin of the above: /ws + /cloud + /ramphastos are not
  # mapped, so a container session is impossible even if a client tries.
  HUB_CLOUD_ENABLED: "false"
  AXN_AUTO_HTTPS: "disable_redirects"
  AXN_DOMAIN: "localhost"
  KEYCLOAK_REALM: "axn-term"
  KEYCLOAK_CLIENT_ID: "axn-term"
  # each session host gets its own <DATA_MOUNT>/<user> bind-mounted at the
  # same path; shells land there and axn state goes to
  # <DATA_MOUNT>/<user>/.axn-term. Set a real host
  # path in .env — unset falls back to /tmp inside the session hosts.
  # DATA_MOUNT: "/mnt/extended/axn-term"
  # kata only when the Docker host has the kata runtime installed; this dev
  # box runs plain runc, and inner dockerd is disabled with it.
  SESSION_HOST_RUNTIME: ""
  SESSION_HOST_DIND: "0"
  # 0:0 root mode: the entrypoint creates a real account named after the
  # keycloak user, pinned to PUID/PGID (host uid) so the DATA_MOUNT bind
  # stays writable and files belong to the host user.
  SESSION_HOST_USER: "0:0"
  # per-user named volume at /home/<user> — persistent home, physically on
  # the extended drive too (docker data-root lives there). Unset → the
  # compose default namespaces it per stack (<project>-home-<user>).
  SESSION_HOST_HOME_VOLUME: ""
  # disabled: no kata → no per-user nix volume (the multi-GB nixpkgs seed
  # copy also blew the Docker VM's disk budget on this box)
  SESSION_HOST_NIX_VOLUME: ""
  PUID: "1000"
  PGID: "1000"
frontend-services:
  shell: "${AXN_SCHEME:-https}://${AXN_LAN_IP:-axn-term.localhost}:${SCENARIO_PORT:-8092}"
backend-services:
  # Single origin: gateway at /gw, Keycloak at /auth on the shell address.
  gateway: "${AXN_SCHEME:-https}://${AXN_LAN_IP:-axn-term.localhost}:${SCENARIO_PORT:-8092}/gw/healthz"
  keycloak: "${AXN_SCHEME:-https}://${AXN_LAN_IP:-axn-term.localhost}:${SCENARIO_PORT:-8092}/auth/realms/axn-term"
frontend:
  - shell
