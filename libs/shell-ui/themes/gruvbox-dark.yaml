  background: '#282828'
  foreground: '#EBDBB2'
  cursor: '#EBDBB2'
  cursorAccent: '#282828'
  selectionBackground: '#504945'
  selectionForeground: '#EBDBB2'

  black: '#282828'
  red: '#E8655F'
  green: '#98971A'
  yellow: '#D79921'
  blue: '#509B9E'
  magenta: '#BE7C9A'
  cyan: '#689D6A'
  white: '#A89984'

  brightBlack: '#928374'
  brightRed: '#FB5441'
  brightGreen: '#B8BB26'
  brightYellow: '#FABD2F'
  brightBlue: '#83A598'
  brightMagenta: '#D3869B'
  brightCyan: '#8EC07C'
  brightWhite: '#EBDBB2'

  orange: '#FE8019'
  violet: '#D3869B'

ui:
  bg: '#1D2021'
  bgSecondary: '#282828'
  surface: '#282828'
  surfaceHover: '#3C3836'
