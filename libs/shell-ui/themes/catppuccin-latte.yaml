# Catppuccin Latte (catppuccin.com). UI colours from Latte's mantle, crust and
# surface layers. Yellow, green and pink were too light for text on base (down to
# 2.3:1); they are darkened within their hue.
# Palette: Catppuccin <https://github.com/catppuccin/palette>, MIT. Copyright (c) 2021 Catppuccin.
# Adjusted for legibility (hue kept, lightness moved):
#   green: #40A02B -> #327C21
#   yellow: #DF8E1D -> #996114
#   blue: #1E66F5 -> #1761F5
#   magenta: #EA76CB -> #C71F9A
#   cyan: #179299 -> #13797E
#   brightGreen: #40A02B -> #3F9E2A
#   brightYellow: #DF8E1D -> #C27B19
#   brightMagenta: #EA76CB -> #E450BD
#   ui.textSecondary: #6C6F85 -> #65687D
#   ui.accent: #8839EF -> #8737EF
id: catppuccin-latte
name: Catppuccin Latte
mode: light

colors:
  background: '#EFF1F5'
  foreground: '#4C4F69'
  cursor: '#DC8A78'
  cursorAccent: '#EFF1F5'
  selectionBackground: '#CCD0DA'
  selectionForeground: '#4C4F69'

  black: '#5C5F77'
  red: '#D20F39'
  green: '#327C21'
  yellow: '#996114'
  blue: '#1761F5'
  magenta: '#C71F9A'
  cyan: '#13797E'
  white: '#ACB0BE'

  brightBlack: '#6C6F85'
  brightRed: '#D20F39'
  brightGreen: '#3F9E2A'
  brightYellow: '#C27B19'
  brightBlue: '#1E66F5'
  brightMagenta: '#E450BD'
  brightCyan: '#179299'
  brightWhite: '#BCC0CC'

  orange: '#FE640B'
  violet: '#8839EF'

ui:
  bg: '#E6E9EF'
  bgSecondary: '#EFF1F5'
  surface: '#EFF1F5'
  surfaceHover: '#DCE0E8'
  text: '#4C4F69'
  textSecondary: '#65687D'
  textInverted: '#EFF1F5'
  border: '#BCC0CC'
  accent: '#8737EF'
  accentHover: '#753EC7'
  cursor: '#DC8A78'
