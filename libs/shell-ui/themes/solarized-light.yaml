# Solarized Light (ethanschoonover.com/solarized). Green, yellow and cyan
# were at or under 3:1 on base3; they are darkened within their hue. Foreground
# nudged to 6:1; secondary UI text was base1 (2.4:1) and is darkened.
# Adjusted for legibility (hue kept, lightness moved):
#   foreground: #657B83 -> #4F6066
#   red: #DC322F -> #DA2825
#   green: #859900 -> #687800
#   yellow: #B58900 -> #8F6C00
#   blue: #268BD2 -> #2076B2
#   magenta: #D33682 -> #CF2D7C
#   cyan: #2AA198 -> #217D76
#   brightGreen: #859900 -> #839600
#   brightYellow: #B58900 -> #B28700
#   brightCyan: #2AA198 -> #299D94
#   ui.textSecondary: #657B83 -> #586B72
#   ui.accent: #268BD2 -> #1E6DA5
