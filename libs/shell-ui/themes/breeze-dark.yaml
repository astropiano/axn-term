# Breeze Dark (KDE Plasma / Konsole). The selection was Breeze's bright
# highlight blue, which left white text at 2.4:1; it is darkened. Bright red and
# bright magenta were darker than their normal shades; they are lifted.
# Adjusted for legibility (hue kept, lightness moved):
#   red: #ED1515 -> #F25555
#   magenta: #9B59B6 -> #AD77C3
#   brightRed: #C0392B -> #DB6B5F
#   brightMagenta: #8E44AD -> #B075C9
#   selectionBackground: #3DAEE9 -> #337CA1
id: breeze-dark
name: Breeze Dark
mode: dark

colors:
  background: '#232627'
  foreground: '#FCFCFC'
  cursor: '#FCFCFC'
  cursorAccent: '#232627'
  selectionBackground: '#337CA1'
  selectionForeground: '#FCFCFC'

  black: '#232627'
  red: '#F25555'
  green: '#11D116'
  yellow: '#F67400'
  blue: '#1D99F3'
  magenta: '#AD77C3'
  cyan: '#1ABC9C'
  white: '#FCFCFC'

  brightBlack: '#7F8C8D'
  brightRed: '#DB6B5F'
  brightGreen: '#1CDC9A'
  brightYellow: '#FDBC4B'
  brightBlue: '#3DAEE9'
  brightMagenta: '#B075C9'
  brightCyan: '#16A085'
  brightWhite: '#FFFFFF'

  orange: '#F67400'
  violet: '#9B59B6'

ui:
  bg: '#202326'
  bgSecondary: '#1D1F22'
  surface: '#292C30'
  surfaceHover: '#313539'
  text: '#FCFCFC'
