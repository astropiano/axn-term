<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>axn-term-hmr</title>
<style>
  body{margin:0;padding:16px;font:12px -apple-system,sans-serif;background:#16181d;color:#e5e5e5;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;gap:12px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8b8f98;margin-bottom:4px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input{flex:1;min-width:0;background:#22242b;border:1px solid #3a3d46;color:#e5e5e5;border-radius:4px;padding:6px 8px;font:11px monospace;outline:none}
  button{background:#22242b;border:1px solid #3a3d46;color:#e5e5e5;border-radius:4px;padding:5px 10px;font:12px -apple-system,sans-serif;cursor:pointer}
  button:hover{background:#2c2f38}button:disabled{opacity:.4;cursor:default}
  pre{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:#1c1e24;border:1px solid #3a3d46;border-radius:4px;padding:8px;font:10px/1.5 monospace;color:#8b8f98;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
  pre::-webkit-scrollbar{width:8px}
  pre::-webkit-scrollbar-thumb{background:#3a3d46;border-radius:4px}
  pre::-webkit-scrollbar-thumb:hover{background:#4a4d56}
  pre::-webkit-scrollbar-track{background:transparent}
  #err{color:#f66;border:1px solid #3a3d46;border-radius:4px;padding:5px 10px;display:none;overflow-wrap:anywhere}
  .option{display:flex;gap:5px;align-items:center;white-space:nowrap}
  .option input{flex:0 0 auto;width:13px;height:13px;margin:0}.option small{color:#8b8f98}
  #warning,#conflict{display:none;border:1px solid #d9a441;border-radius:4px;padding:5px 10px;color:#d9a441}
  #conflict{display:none;border-color:#f66;color:#f66}
  #squatter{display:none;align-items:center;gap:8px;border:1px solid #d9a441;border-radius:4px;padding:5px 10px;color:#d9a441}
  #squatter>span:first-child{min-width:0;overflow-wrap:anywhere}
  #squatter button{flex:0 0 auto}
  .mono{font-family:monospace;color:#8b8f98}
</style>
</head>
<body>
<div>
  <div class="lbl">checkout</div>
  <div class="row">
    <input id="repo" placeholder="/path/to/axn-term checkout" spellcheck="false">
    <button id="browse">Browse…</button>
  </div>
</div>
<div class="row">
  <span class="lbl" style="margin:0">vite:</span><span id="status">…</span>
  <span class="mono" id="port"></span><span style="flex:1"></span>
  <label class="option" title="Use ~/.axn-term state and configuration">
    <input id="realState" type="checkbox">
    <span>Use real axn-term state</span>
  </label>
  <button id="stop">Stop</button><button id="start">Start</button>
  <button id="open">Open window</button><button id="install">pnpm install</button>
</div>
<div id="warning">Warning: real-state HMR shares application data with axn-term. Do not run both at the same time.</div>
<div id="conflict">The normal axn-term app is currently running. Close it before starting real-state HMR.</div>
<div id="squatter"><span>port is held by <span id="squatterWho" class="mono"></span></span><span style="flex:1"></span><button id="killStart">Kill &amp; start</button></div>
<div id="err"></div>
<pre id="log">vite output appears here</pre>
<script>
const invoke = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
const $ = id => document.getElementById(id);
let repoConfigured = null;
const LABEL = {idle:'stopped',installing:'installing…',starting:'starting…',running:'running',exited:'exited'};
async function refresh(){
  try{
    const s = await invoke('dev_hmr_status');
    repoConfigured = s.repo;
    $('status').textContent = LABEL[s.vite]||s.vite;
    $('port').textContent = s.port ? `http://127.0.0.1:${s.port}` : '';
    $('err').style.display = s.error ? 'block':'none';
    $('err').textContent = s.error||'';
    $('log').textContent = (s.log||[]).join('\n')||'vite output appears here';
    $('log').scrollTop = $('log').scrollHeight;
    $('realState').checked = !!s.useRealState;
    const running = s.vite==='running'||s.vite==='starting';
    $('realState').disabled = running;
    $('realState').closest('label').title = running
      ? 'Stop vite to change the state mode'
      : 'Use ~/.axn-term state and configuration';
    $('warning').style.display = s.useRealState ? 'block' : 'none';
    $('conflict').style.display = s.realStateConflict ? 'block' : 'none';
    const h = s.portHolder;
    $('squatter').style.display = h ? 'flex' : 'none';
    if (h) $('squatterWho').textContent = `${h.command||'another process'}${h.pids&&h.pids.length?` (pid ${h.pids.join(', ')})`:''}`;
    $('start').disabled = running||!s.repo||s.realStateConflict; $('stop').disabled = !running;
    $('open').disabled = s.vite!=='running'||s.realStateConflict; $('install').disabled = !s.repo||running;
    if(!$('repo').value && s.repo) $('repo').value = s.repo;
  }catch(e){}
}
async function pick(){
  const dir = await invoke('plugin:dialog|open',{options:{directory:true,title:'axn-term checkout / worktree'}});
  if(dir){$('repo').value=dir;await invoke('dev_hmr_set_repo',{repo:dir});}
}
async function apply(){
  const v = $('repo').value.trim();
  if(v && v!==repoConfigured) await invoke('dev_hmr_set_repo',{repo:v});
}
$('browse').onclick = pick;
$('repo').addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
$('repo').addEventListener('blur',apply);
$('realState').onchange = e => invoke('dev_hmr_set_real_state',{useRealState:e.target.checked});
$('start').onclick = ()=>invoke('dev_hmr_start');
$('stop').onclick  = ()=>invoke('dev_hmr_stop');
$('open').onclick  = ()=>invoke('dev_hmr_open_main');
$('install').onclick = ()=>invoke('dev_hmr_install');
$('killStart').onclick = async ()=>{
  try{
    await invoke('dev_hmr_free_port');
    await invoke('dev_hmr_start');
  }catch(e){ $('err').textContent = String(e); $('err').style.display = 'block'; }
};
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
