<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>axn-term-hmr</title>
<style>
  body{margin:0;padding:16px;font:12px -apple-system,sans-serif;background:#16181d;color:#e5e5e5;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;gap:12px}
  .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#8b8f98;margin-bottom:4px}
  .row{display:flex;gap:8px;align-items:center}
  input{flex:1;min-width:0;background:#22242b;border:1px solid #3a3d46;color:#e5e5e5;border-radius:4px;padding:6px 8px;font:11px monospace;outline:none}
  button{background:#22242b;border:1px solid #3a3d46;color:#e5e5e5;border-radius:4px;padding:5px 10px;font:12px -apple-system,sans-serif;cursor:pointer}
  button:hover{background:#2c2f38}button:disabled{opacity:.4;cursor:default}
  pre{flex:1;min-height:0;overflow:auto;background:#1c1e24;border:1px solid #3a3d46;border-radius:4px;padding:8px;font:10px/1.5 monospace;color:#8b8f98;white-space:pre-wrap;margin:0}
  #err{color:#f66;border:1px solid #3a3d46;border-radius:4px;padding:5px 10px;display:none}
  .mono{font-family:monospace;color:#8b8f98}
</style>
</head>
<body>
<div>
  <div class="lbl">checkout</div>
  <div class="row">
    <input id="repo" placeholder="/path/to/axn-term checkout" spellcheck="false">
    <button id="browse">Browse…</button>
  </div>
</div>
<div class="row">
  <span class="lbl" style="margin:0">vite:</span><span id="status">…</span>
  <span class="mono" id="port"></span><span style="flex:1"></span>
  <button id="stop">Stop</button><button id="start">Start</button>
  <button id="open">Open window</button><button id="install">pnpm install</button>
</div>
<div id="err"></div>
<pre id="log">vite output appears here</pre>
<script>
const invoke = (c, a) => window.__TAURI_INTERNALS__.invoke(c, a);
const $ = id => document.getElementById(id);
let repoConfigured = null;
const LABEL = {idle:'stopped',installing:'installing…',starting:'starting…',running:'running',exited:'exited'};
async function refresh(){
  try{
    const s = await invoke('dev_hmr_status');
    repoConfigured = s.repo;
    $('status').textContent = LABEL[s.vite]||s.vite;
    $('port').textContent = s.port ? `http://localhost:${s.port}` : '';
    $('err').style.display = s.error ? 'block':'none';
    $('err').textContent = s.error||'';
    $('log').textContent = (s.log||[]).join('\n')||'vite output appears here';
    $('log').scrollTop = $('log').scrollHeight;
    const run = s.vite==='running'||s.vite==='starting';
    $('start').disabled = run||!s.repo; $('stop').disabled = !run;
    $('open').disabled = s.vite!=='running'; $('install').disabled = !s.repo||run;
    if(!$('repo').value && s.repo) $('repo').value = s.repo;
  }catch(e){}
}
async function pick(){
  const dir = await invoke('plugin:dialog|open',{options:{directory:true,title:'axn-term checkout / worktree'}});
  if(dir){$('repo').value=dir;await invoke('dev_hmr_set_repo',{repo:dir});}
}
async function apply(){
  const v = $('repo').value.trim();
  if(v && v!==repoConfigured) await invoke('dev_hmr_set_repo',{repo:v});
}
$('browse').onclick = pick;
$('repo').addEventListener('keydown',e=>{if(e.key==='Enter')apply()});
$('repo').addEventListener('blur',apply);
$('start').onclick = ()=>invoke('dev_hmr_start');
$('stop').onclick  = ()=>invoke('dev_hmr_stop');
$('open').onclick  = ()=>invoke('dev_hmr_open_main');
$('install').onclick = ()=>invoke('dev_hmr_install');
refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
