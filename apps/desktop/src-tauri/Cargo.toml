[package]
name = "axn-term"
version = "0.1.0"
description = "axn-term desktop application"
authors = ["axn-term"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "axn_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
keyring = "3"
tauri-plugin-fs = "2"
arboard = "3"
tauri-plugin-notification = "2.5"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = { version = "0.4", features = ["std"] }
tauri-plugin-dialog = "2"
tiny_http = "0.12"
mdns-sd = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
# termios (VERASE) and process-group kill — Unix only.
nix = { version = "0.28", features = ["term", "signal"] }
# Async-signal-safe SIGTERM/SIGHUP flag — session teardown (logout, restart,
# shutdown) terminates the app with SIGTERM.
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# sysctl(KERN_PROCARGS2) / proc_pidinfo — foreground argv and cwd without
# spawning `ps`/`lsof` on every 1 s terminal poll.
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Same major version tao/wry link against; used to strip the Wayland
# titlebar where the compositor draws server-side decorations (KDE,
# wlroots) — GNOME and friends keep the themed GTK headerbar (window.rs).
gtk = "0.18"

