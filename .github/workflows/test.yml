name: tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Root vitest delegates to each package's own config (like nx run-many -t test).
      - run: pnpm exec vitest run
      # Catalog drift check — catches un-extracted strings (lingui check sync).
      - run: pnpm i18n:check
      - name: typecheck
        run: pnpm --filter @axn-term/desktop exec tsc

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test axn-term.slnx

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri codegen embeds frontendDist (../dist) — build it first; the
      # desktop `build` script is `tsc && vite build`.
      - run: pnpm --filter @axn-term/desktop build
      - name: Tauri system deps (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
